name: Release

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/release.yml'
    tags:
      - '*.*.*'
  workflow_dispatch:

env:
  PLAY_TRACK: production
  PLAY_STATUS: draft

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Check version
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          TAG="${GITHUB_REF_TYPE}"
          if [ "$TAG" = "branch" ]; then TAG="$VERSION_NAME"; else TAG="${GITHUB_REF_NAME}"; fi
          if [ "$TAG" != "$VERSION_NAME" ]; then
            echo "::error::tag ($TAG) does not match versionName ($VERSION_NAME)"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties

      - name: Build GitHub APK
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease

      - name: Build Play AAB
        run: ./gradlew bundlePlayRelease

      - name: Prepare release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/github/release/*-arm64-v8a-release.apk "dist/rikkanap-${VERSION}-arm64-v8a.apk"
          cp app/build/outputs/mapping/githubRelease/mapping.txt "dist/mapping-${VERSION}.txt"
          (cd dist && zip -j "mapping-${VERSION}.zip" "mapping-${VERSION}.txt" && rm "mapping-${VERSION}.txt")
          ls -l dist

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          draft: true
          files: dist/*

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.cutiecookie.rikkanap
          releaseFiles: app/build/outputs/bundle/playRelease/*.aab
          mappingFile: app/build/outputs/mapping/playRelease/mapping.txt
          releaseName: ${{ steps.version.outputs.version }}
          track: ${{ env.PLAY_TRACK }}
          status: ${{ env.PLAY_STATUS }}
