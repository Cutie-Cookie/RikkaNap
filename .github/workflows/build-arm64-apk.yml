name: Build ARM64 APK

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build-arm64-apk.yml'
      - 'app/build.gradle.kts'
      - 'app/src/main/res/**'
      - 'web-ui/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradlew'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Prepare release signing
        run: |
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties

      - name: Build ARM64 GitHub APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleGithubRelease
          mkdir -p dist
          cp app/build/outputs/apk/github/release/*-arm64-v8a-release.apk dist/rikkanap-arm64-v8a.apk
          test -s dist/rikkanap-arm64-v8a.apk
          file dist/rikkanap-arm64-v8a.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rikkanap-arm64-v8a
          path: dist/rikkanap-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
