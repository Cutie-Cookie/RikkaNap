name: Build ARM64 APK

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build-arm64-apk.yml'
      - 'app/build.gradle.kts'
      - 'app/src/main/res/**'
      - 'app/src/main/java/**'
      - 'app/src/main/kotlin/**'
      - 'web-ui/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradlew'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Prepare release signing
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.KEY_BASE64 }}" | base64 --decode > app/app.key
          test -s app/app.key
          printf '%s\n' "${{ secrets.SIGNING_CONFIG }}" > local.properties
          for property in storeFile storePassword keyAlias keyPassword; do
            if ! grep -Eq "^${property}=.+" local.properties; then
              echo "::error::SIGNING_CONFIG is missing required property: ${property}"
              exit 1
            fi
          done

      - name: Build ARM64 GitHub APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleGithubRelease
          mkdir -p dist
          cp app/build/outputs/apk/github/release/*-arm64-v8a-release.apk dist/rikkanap-arm64-v8a.apk
          test -s dist/rikkanap-arm64-v8a.apk
          file dist/rikkanap-arm64-v8a.apk

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}" -type f -path '*/build-tools/*/apksigner' | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs dist/rikkanap-arm64-v8a.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rikkanap-arm64-v8a
          path: dist/rikkanap-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
